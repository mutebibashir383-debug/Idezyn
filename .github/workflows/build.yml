name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 6 1 * *'   # monthly rebuild picks up the latest device tools

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-libimobiledevice
            mingw-w64-x86_64-libirecovery
            mingw-w64-x86_64-idevicerestore
      - name: Collect device tools
        shell: msys2 {0}
        run: |
          mkdir -p resources/bin
          for t in idevice_id ideviceinfo ideviceenterrecovery irecovery idevicerestore idevicebackup2 idevicediagnostics idevicecrashreport; do
            cp /mingw64/bin/$t.exe resources/bin/
          done
          ldd resources/bin/*.exe | awk '/mingw64/{print $3}' | sort -u | xargs -I{} cp {} resources/bin/
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with: { name: Open-windows, path: dist/*.exe }

  macos:
    strategy:
      matrix:
        include:
          - { os: macos-14, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect device tools
        run: |
          brew install libimobiledevice libirecovery idevicerestore dylibbundler
          mkdir -p resources/bin/libs
          for t in idevice_id ideviceinfo ideviceenterrecovery irecovery idevicerestore idevicebackup2 idevicediagnostics idevicecrashreport; do
            cp "$(brew --prefix)/bin/$t" resources/bin/
            dylibbundler -of -b -x resources/bin/$t -d resources/bin/libs -p @executable_path/libs
          done
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish onTag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with: { name: Open-mac-${{ matrix.arch }}, path: dist/*.dmg }
