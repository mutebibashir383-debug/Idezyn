<style>
:root{--bg:#0D0820;--panel:#150E30;--panel2:#1E1545;--ac:#A78BFA;--pu:#5E17EB;--or:#FF8A57;--fo:#FFB48C;--tx:#F6F3FF;--mut:#C9C3E6;--bd:rgba(139,92,246,.28);--g1:rgba(94,23,235,.38);--g2:rgba(255,127,71,.16);--ok:#3ddc97;--er:#ff6b7a;--wr:#ffc857;--r:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F6F3FF;--panel:#fff;--panel2:#EFE9FF;--ac:#5E17EB;--or:#B33A09;--fo:#5E17EB;--tx:#1A0F3C;--mut:#4B4470;--bd:rgba(94,23,235,.22);--g1:rgba(94,23,235,.10);--g2:rgba(255,127,71,.08);--ok:#0F7A55;--er:#C42B41;--wr:#9A6A00}:root:not([data-theme="dark"]) .logo span{background:linear-gradient(90deg,#5E17EB,#0E8FA6);-webkit-background-clip:text;background-clip:text;color:transparent}}
:root[data-theme="light"]{--bg:#F6F3FF;--panel:#fff;--panel2:#EFE9FF;--ac:#5E17EB;--or:#B33A09;--fo:#5E17EB;--tx:#1A0F3C;--mut:#4B4470;--bd:rgba(94,23,235,.22);--g1:rgba(94,23,235,.10);--g2:rgba(255,127,71,.08);--ok:#0F7A55;--er:#C42B41;--wr:#9A6A00}
:root[data-theme="light"] .logo span{background:linear-gradient(90deg,#5E17EB,#0E8FA6);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="dark"]{--bg:#0D0820;--panel:#150E30;--panel2:#1E1545;--ac:#A78BFA;--pu:#5E17EB;--or:#FF8A57;--fo:#FFB48C;--tx:#F6F3FF;--mut:#C9C3E6;--bd:rgba(139,92,246,.28);--g1:rgba(94,23,235,.38);--g2:rgba(255,127,71,.16);--ok:#3ddc97;--er:#ff6b7a;--wr:#ffc857}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(900px 520px at 78% -12%,var(--g1),transparent),radial-gradient(760px 420px at 0% 112%,var(--g2),transparent),var(--bg);color:var(--tx);font-family:Manrope,Inter,system-ui,sans-serif;font-size:15px}
#app{display:grid;grid-template-columns:250px 1fr;grid-template-rows:1fr auto;height:100%}
aside{background:var(--panel);border-right:1px solid var(--bd);padding:20px 14px;display:flex;flex-direction:column;gap:6px;grid-row:1/3;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.18em;font-size:18px;padding:4px 10px 18px}
.logo img{border-radius:50%;display:block}.logo span{background:linear-gradient(90deg,#8b5cf6,#5edce8);-webkit-background-clip:text;background-clip:text;color:transparent}

.nav:hover{color:var(--tx);background:var(--panel2)}.nav.on{color:var(--tx);background:var(--panel2);border-color:var(--bd);box-shadow:0 0 14px rgba(139,92,246,.12)}
.nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.nav.on svg{stroke:var(--ac)}
main{padding:28px 34px;overflow:auto}
footer{display:flex;gap:18px;align-items:center;justify-content:space-between;padding:10px 34px;border-top:1px solid var(--bd);background:var(--panel);color:var(--mut);font-size:14px;flex-wrap:wrap}
footer button{background:none;border:0;color:var(--mut);font:inherit;cursor:pointer}footer button:hover{color:var(--ac)}
h1{font-size:30px;margin:0 0 6px;font-weight:800}h2{margin:0 0 6px}p{line-height:1.55}.mut{color:var(--mut)}
.card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--bd);border-radius:var(--r);padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.grid{display:grid;gap:18px}.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.btn{background:linear-gradient(135deg,#5E17EB,#7A33F0);color:#fff;border:0;border-radius:12px;padding:11px 20px;font:inherit;font-weight:800;cursor:pointer;transition:.2s;box-shadow:0 0 18px rgba(94,23,235,.45)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd);box-shadow:none}.btn.dng{background:#C42B41;color:#fff;box-shadow:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.ico{width:46px;height:46px;border-radius:13px;background:rgba(139,92,246,.1);border:1px solid var(--bd);display:grid;place-items:center;margin-bottom:14px}
.ico svg{width:24px;height:24px;stroke:var(--ac);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;margin:22px 0}
.pill{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:99px;border:1px solid var(--bd);font-size:14px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut)}.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.wr{background:var(--wr)}.dot.er{background:var(--er)}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;background:rgba(255,127,71,.16);color:var(--or);letter-spacing:.06em}
.bar{height:10px;background:var(--panel2);border-radius:9px;overflow:hidden;border:1px solid var(--bd)}.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#5E17EB,#FF7F47);transition:width .4s}
.steps{display:flex;gap:6px;margin:14px 0}.steps span{flex:1;height:6px;border-radius:4px;background:var(--panel2)}.steps span.on{background:var(--or)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button{background:var(--panel2);border:1px solid var(--bd);color:var(--mut);padding:8px 14px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}.tabs button.on{color:var(--tx);border-color:var(--or)}
.usb{animation:glow 2.4s ease-in-out infinite}@keyframes glow{50%{filter:drop-shadow(0 0 14px var(--ac))}}
.fade{animation:fd .35s}@keyframes fd{from{opacity:0;transform:translateY(8px)}}
table{width:100%;border-collapse:collapse}td{padding:11px 4px;border-bottom:1px solid var(--bd)}td:first-child{color:var(--mut);width:42%}
.modal{position:fixed;inset:0;background:rgba(8,4,24,.72);display:grid;place-items:center;z-index:20;padding:16px}
.modal>div{max-width:520px;width:100%;max-height:90%;overflow:auto}
#toasts{position:fixed;right:18px;bottom:60px;display:grid;gap:8px;z-index:30}
.toast{background:var(--panel);border:1px solid var(--ac);border-radius:12px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:fd .3s;max-width:320px}
[data-tip]{position:relative}[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:110%;left:0;background:#000c;color:#fff;font-size:14px;padding:6px 9px;border-radius:8px;white-space:nowrap;z-index:5}
.spin{width:44px;height:44px;border:4px solid var(--panel2);border-top-color:var(--or);border-radius:50%;animation:sp 1s linear infinite;margin:10px auto}@keyframes sp{to{transform:rotate(360deg)}}
details{border-bottom:1px solid var(--bd);padding:12px 0}summary{cursor:pointer;font-weight:700}
select,.sw{background:var(--panel2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font:inherit}
.set{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--bd);gap:12px}
@media(max-width:860px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}aside{grid-row:auto;flex-direction:row;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--bd)}.logo{padding:4px 8px}.nav{white-space:nowrap;padding:9px 11px}main{padding:18px}.hero{grid-template-columns:1fr}footer{padding:10px 18px}}
